[project]
name = "sdv-sim"
version = "0.1.0"
description = "SDV (Software Defined Vehicle) simulator — E/E architecture, in-vehicle communication (CAN/Ethernet), app runtime simulation"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
sdv-sim = "sdv_sim.cli.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdv_sim"]
# v2 dashboard UI: the packaged static assets must ship in the wheel
# (ASR-019 — "패키지 내부 정적 자산, wheel 포함"). The frontend build
# (`npm run build` → sdv_sim/server/static/) is part of the release
# procedure. static/ is excluded from the package's default file include
# and instead force-included explicitly — a missing frontend build becomes
# a build-time error instead of silently shipping a wheel without the UI.
exclude = ["sdv_sim/server/static"]
force-include = { "sdv_sim/server/static" = "sdv_sim/server/static" }

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sdv_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
