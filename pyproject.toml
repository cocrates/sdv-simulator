[project]
name = "sdv-sim"
version = "0.1.0"
description = "SDV (Software Defined Vehicle) simulator — E/E architecture, in-vehicle communication (CAN/Ethernet), app runtime simulation"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
sdv-sim = "sdv_sim.cli.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdv_sim"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["sdv_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
